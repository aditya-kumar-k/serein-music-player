<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Serein Music Player</title>
  <link rel="stylesheet" href="styles.css">

</head>
<body>

<div id="app">

  <!-- ── SIDEBAR ── -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon"></div>
      <h3 id="sidebarTitle">Library</h3>
      <button class="sidebar-toggle" id="toolsBtn" onclick="showToolsMenu(this)" title="Library tools: backup, duplicates" aria-label="Library tools">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></svg>
      </button>
      <button class="sidebar-toggle" onclick="toggleSidebar()" title="Hide sidebar (Ctrl+B)" aria-label="Hide sidebar">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg>
      </button>
    </div>
    <div class="sidebar-nav">
      <button class="nav-btn active" id="nav-library"   onclick="showSection('library')">Library</button>
      <button class="nav-btn"        id="nav-favorites" onclick="showSection('favorites')">Favorites</button>
      <button class="nav-btn"        id="nav-playlists" onclick="showSection('playlists')">Playlists</button>
      <button class="nav-btn"        id="nav-history"   onclick="showSection('history')">History</button>
      <button class="nav-btn"        id="nav-queue"     onclick="showSection('queue')">Queue<span class="nav-badge" id="queueBadge" style="display:none"></span></button>
    </div>
    <div class="lib-tools" id="libTools"><div class="lib-tools-inner">
      <div class="lang-chips" id="langChips"></div>
      <div class="search-wrap">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search songs…" oninput="filterSongs(this.value)">
          <button class="search-clear" id="searchClear" type="button" aria-label="Clear search" title="Clear">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>
    </div></div>

    <ul id="songList"></ul>
  </div>

  <!-- ── MAIN PLAYER ── -->
  <div class="main">

    <button class="sidebar-toggle mini-toggle" onclick="toggleMini()" title="Mini player (Ctrl+Shift+M)" aria-label="Toggle mini player">
      <svg class="mini-in" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><rect x="11.5" y="11.5" width="7" height="5" rx="1.2" fill="currentColor" stroke="none"/></svg>
      <svg class="mini-out" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
    </button>
    <button class="sidebar-toggle lyrics-open-btn" onclick="toggleLyrics()" title="Show lyrics (Ctrl+L)" aria-label="Show lyrics">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg>
    </button>
    <button class="sidebar-toggle sidebar-open-btn" onclick="toggleSidebar()" title="Show sidebar (Ctrl+B)" aria-label="Show sidebar">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg>
    </button>

    <div class="player-top-bar">
      <button class="player-top-btn" id="playerCloseBtn" onclick="closePlayerSmooth()" title="Back to Library" aria-label="Back to Library">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="player-top-title">NOW PLAYING</div>
      <button class="player-top-btn" id="playerMoreOptionsBtn" onclick="showPlayerMenu(this)" title="Options" aria-label="Options">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
    </div>

    <button class="player-menu-btn" id="playerMenuBtn" onclick="showPlayerMenu(this)" title="Menu" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
    </button>

    <div class="album-art" id="albumArt"><svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg><img id="coverImg" alt=""></div>

    <div class="song-info">
      <div id="playlistBadge" style="display:none;"></div>
      <div class="song-info-row">
        <div class="song-info-text">
          <div id="nowPlaying">No song selected</div>
          <div id="songMeta">—</div>
        </div>
        <button class="btn-fav-modern" id="favBtnMobile" onclick="onFavClick(event, this)" title="Favorite" aria-label="Favorite">
          <svg class="heart-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
      </div>
    </div>

    <!-- Seek -->
    <div class="seek-section">
      <div class="time-row">
        <span id="timeLeft">0:00</span>
        <span id="timeRight">0:00</span>
      </div>
      <div class="seek-container">
        <div id="loopOverlay"></div>
        <input type="range" id="seekBar" min="0" max="100" value="0">
      </div>
      <div class="loop-labels">
        <span id="labelA"></span>
        <span id="labelB"></span>
      </div>
    </div>

    <!-- Transport Controls -->
    <div class="controls modern-controls">
      <button class="btn-icon btn-ctrl-sub" id="shuffleBtnMobile" onclick="toggleShuffle()" title="Shuffle (Ctrl+S)" aria-label="Shuffle"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg></button>
      <button class="btn-icon btn-ctrl-main" onclick="prev()"        title="Previous (Ctrl+←)" aria-label="Previous"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M6 5h2v14H6zM20 5.5v13a.8.8 0 0 1-1.2.7L9.5 12.7a.8.8 0 0 1 0-1.4l9.3-6.5A.8.8 0 0 1 20 5.5z"/></svg></button>
      <button class="btn-play btn-icon" id="playPauseBtn" onclick="togglePlay()" title="Play/Pause (Space)" aria-label="Play/Pause"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg></button>
      <button class="btn-icon btn-ctrl-main" onclick="next()"        title="Next (Ctrl+→)" aria-label="Next"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M16 5h2v14h-2zM4 5.5v13a.8.8 0 0 0 1.200.7l9.300-6.5a.8.8 0 0 0 0-1.400L5.200 4.800A.8.8 0 0 0 4 5.5z"/></svg></button>
      <button class="btn-icon btn-ctrl-sub" id="repeatBtnMobile" onclick="toggleRepeat()" title="Repeat all" aria-label="Repeat"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
    </div>

    <!-- Secondary Controls -->
    <div class="controls secondary">
      <button class="btn-fav"  id="favBtn"             onclick="onFavClick()" title="Save to favorites (F = quick toggle)">☆</button>
      <button class="btn-fav"  id="addToPlaylistBtn"   onclick="showAddToPlaylistPopup()" title="Add to playlist">+</button>
      <button class="btn-fav"  id="ringtoneBtn"        onclick="openRingtoneMakerForCurrent()" title="Make a ringtone from this song"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/></svg></button>
      <span class="ctl-sep"></span>
      <div class="ab-group">
        <button class="btn-ab" id="btnA" onclick="setA()"     title="Set loop start (A)">A</button>
        <button class="btn-ab" id="btnB" onclick="setB()"     title="Set loop end (B)">B</button>
        <button class="btn-ab"           onclick="clearLoop()" title="Clear loop (C)">C</button>
        <button class="btn-ab" id="repeatOneBtn" onclick="toggleRepeatOne()" title="Repeat this song"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/><path d="M11 10l1.5-1v6" stroke-width="1.6"/></svg></button>
      </div>
      <button class="btn-loop" id="moreBtn" onclick="toggleMoreControls()" title="Shuffle, repeat, sleep timer, visualizer" aria-expanded="false">More ▾</button>
      <div class="more-group" id="moreGroup">
        <button class="btn-loop" id="shuffleBtn" onclick="toggleShuffle()" title="Shuffle (Ctrl+S)">Shuffle</button>
        <button class="btn-loop active" id="repeatBtn" onclick="toggleRepeat()">Repeat all</button>
        <button class="btn-loop" id="sleepTimerBtn" onclick="showSleepTimer()" title="Sleep timer">Sleep</button>
        <button class="btn-loop active" id="vizBtn" onclick="cycleViz()" title="Visualizer: off / bars / wave / ring (V)">Viz · Bars</button>
      </div>
    </div>

    <!-- Volume -->
    <div class="volume-row">
      <span class="vol-icon" onclick="toggleMute()" id="volIcon"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor" stroke="none"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></span>
      <input type="range" id="volumeBar" min="0" max="100" value="80" oninput="setVolume(this.value)">
    </div>

  </div>

  <!-- ── LYRICS ── -->
  <div class="lyrics">
    <div class="lyrics-header">
      <span>Lyrics</span>
      <div style="display:flex; gap:6px; align-items:center;">
        <button class="btn-fetch" id="lyricsFetchBtn" onclick="onFetchLyrics()" title="Fetch lyrics from internet">Fetch</button>
        <button class="btn-fetch" id="lyricsEditBtn"  onclick="switchToEditMode()" title="Switch to edit mode" style="display:none;">Edit</button>
        <button class="btn-save"  onclick="saveLyrics()">Save</button>
        <button class="sidebar-toggle" onclick="toggleLyricsFullscreen()" title="Full-screen lyrics (L)" aria-label="Full-screen lyrics">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <button class="sidebar-toggle" onclick="toggleLyrics()" title="Hide lyrics (Ctrl+L)" aria-label="Hide lyrics">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg>
        </button>
      </div>
    </div>
    <textarea id="lyricsPanel" placeholder="No lyrics yet. Paste them here and hit Save, or press Fetch to load them from the internet."></textarea>
  </div>

</div>

<!-- ── MOBILE MINI PLAYER ── -->
<div class="mobile-mini-player" id="mobileMiniPlayer" onclick="openPlayerSmooth()" style="display:none;">
  <div class="mini-art" id="mobMiniArt">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
  </div>
  <div class="mini-info">
    <div class="mini-title" id="mobMiniTitle">No song selected</div>
    <div class="mini-artist" id="mobMiniArtist">Serein Music Player</div>
  </div>
  <div class="mini-actions" onclick="event.stopPropagation()">
    <button class="mini-btn" id="mobMiniPlayBtn" onclick="togglePlay()" aria-label="Play/Pause">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
    </button>
    <button class="mini-btn" onclick="next()" aria-label="Next">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M16 5h2v14h-2zM4 5.5v13a.8.8 0 0 0 1.200.7l9.300-6.5a.8.8 0 0 0 0-1.400L5.200 4.800A.8.8 0 0 0 4 5.5z"/></svg>
    </button>
  </div>
</div>

<!-- Mobile: hamburger in the title bar of every screen (the in-player copy is for desktop) -->
<button class="player-menu-btn mobile-menu-btn" id="mobMenuBtn" onclick="showPlayerMenu(this)" title="Menu" aria-label="Menu">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
</button>

<!-- ── MOBILE BOTTOM NAVIGATION ── -->
<nav class="mobile-bottom-nav">
  <button class="mob-nav-btn active" data-tab="library" onclick="switchMobileTab('library')">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12zm-8-2h6v-2h-6v2zm0-3h6V9h-6v2zm0-3h6V6h-6v2z"/></svg>
    <span>Library</span>
  </button>
  <button class="mob-nav-btn" data-tab="player" onclick="switchMobileTab('player')">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/></svg>
    <span>Player</span>
  </button>
  <button class="mob-nav-btn" data-tab="lyrics" onclick="switchMobileTab('lyrics')">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    <span>Lyrics</span>
  </button>
</nav>

<script src="vendor/howler.min.js"></script>
<script src="vendor/sanscript.js"></script>
<script src="vendor/jsmediatags.min.js"></script>
<script src="platform-adapter.js"></script>
<script src="translit.js"></script>
<script src="renderer.js"></script>
<script src="extras.js"></script>
<script src="library-tools.js"></script>
<script src="eq.js"></script>
<script src="visualizer.js"></script>
<script src="ringtone.js"></script>
<script src="mobile-ui.js"></script>

<script>
  // ── Collapsible sidebar (state remembered between launches) ──
  function setSidebarCollapsed(collapsed) {
    document.getElementById('app').classList.toggle('sidebar-collapsed', collapsed);
    try { localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0'); } catch {}
  }
  function toggleSidebar() {
    setSidebarCollapsed(!document.getElementById('app').classList.contains('sidebar-collapsed'));
  }
  try { if (localStorage.getItem('sidebarCollapsed') === '1') setSidebarCollapsed(true); } catch {}

  // ── Collapsible lyrics panel ──
  function setLyricsCollapsed(collapsed) {
    document.getElementById('app').classList.toggle('lyrics-collapsed', collapsed);
    try { localStorage.setItem('lyricsCollapsed', collapsed ? '1' : '0'); } catch {}
  }
  function toggleLyrics() {
    setLyricsCollapsed(!document.getElementById('app').classList.contains('lyrics-collapsed'));
  }
  try { if (localStorage.getItem('lyricsCollapsed') === '1') setLyricsCollapsed(true); } catch {}
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'b') {
      e.preventDefault();
      toggleSidebar();
    }
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'l') {
      e.preventDefault();
      toggleLyrics();
    }
  });
</script>

</body>
</html>
